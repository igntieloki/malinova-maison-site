<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - Malinova Maison</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f4f4; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h2 { margin-top: 0; color: #111; }
        .price { font-size: 22px; color: #333; margin: 20px 0; }
        button { width: 100%; padding: 14px; background-color: #111; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #333; }
        .back-link { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>Mon Panier</h2>
    <p>Article : Commande Test Malinova Maison</p>
    <div class="price">Total : <strong>29,00 €</strong></div>
    
    <!-- Redirige vers la route Flask qui génère la session Stripe Checkout -->
    <form action="/creer-paiement" method="POST">
        <button type="submit">Payer en toute sécurité</button>
    </form>
    
    <a href="/" class="back-link">Continuer mes achats</a>
</div>

</body>
</html>
